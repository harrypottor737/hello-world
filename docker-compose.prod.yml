version: '3.8'

# Production Docker Compose Configuration
# Includes nginx reverse proxy, SSL, and monitoring

services:
  video-dubbing-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: video-dubbing-lipsync-prod
    environment:
      - FLASK_APP=app_lipsync.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - video_uploads:/app/uploads
      - video_outputs:/app/outputs
      - video_temp:/app/temp
    restart: always
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - video-dubbing-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  nginx:
    image: nginx:alpine
    container_name: video-dubbing-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - video-dubbing-app
    restart: always
    networks:
      - video-dubbing-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: video-dubbing-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - video-dubbing-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: video-dubbing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - video-dubbing-network
    profiles:
      - "monitoring"

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: video-dubbing-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - video-dubbing-network
    profiles:
      - "monitoring"

  # Log aggregation with Fluentd (optional)
  fluentd:
    build: ./docker/fluentd
    container_name: video-dubbing-fluentd
    volumes:
      - ./docker/fluentd/conf:/fluentd/etc
      - nginx_logs:/var/log/nginx:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    restart: unless-stopped
    networks:
      - video-dubbing-network
    profiles:
      - "logging"

volumes:
  video_uploads:
    driver: local
  video_outputs:
    driver: local
  video_temp:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  video-dubbing-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16