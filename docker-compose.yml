version: '3.8'

services:
  video-dubbing-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: video-dubbing-lipsync
    ports:
      - "5001:5001"
    environment:
      - FLASK_APP=app_lipsync.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent storage for uploads and outputs
      - video_uploads:/app/uploads
      - video_outputs:/app/outputs
      - video_temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.video-dubbing.rule=Host(`localhost`)"
      - "traefik.http.services.video-dubbing.loadbalancer.server.port=5001"
    networks:
      - video-dubbing-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: video-dubbing-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - video-dubbing-network
    profiles:
      - "with-redis"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: video-dubbing-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - video-dubbing-app
    restart: unless-stopped
    networks:
      - video-dubbing-network
    profiles:
      - "with-nginx"

volumes:
  video_uploads:
    driver: local
  video_outputs:
    driver: local
  video_temp:
    driver: local
  redis_data:
    driver: local

networks:
  video-dubbing-network:
    driver: bridge