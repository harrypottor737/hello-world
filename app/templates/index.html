<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Indic Video Dubbing</title>
	<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
	<div class="container">
		<h1>Indic Video Dubbing</h1>
		<form action="/process" method="post" enctype="multipart/form-data" class="card">
			<label class="label">Upload video</label>
			<input type="file" name="video" accept="video/*" required />
			<label class="label">Target language</label>
			<select name="target_lang" required>
				{% for code, label in languages.items() %}
				<option value="{{ code }}">{{ label }} ({{ code }})</option>
				{% endfor %}
			</select>
			<button type="submit">Dub Video</button>
		</form>
	</div>
</body>
</html>
