<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Video Dubbing Tool</title>
	<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
	<div class="container">
		<h1>Video Dubbing Tool</h1>
		<form id="dub-form">
			<label>Video file
				<input type="file" name="video" id="video" accept="video/*" required />
			</label>
			<label>Language
				<select name="language" id="language" required>
					<option value="hi">Hindi</option>
					<option value="kn">Kannada</option>
					<option value="ta">Tamil</option>
					<option value="te">Telugu</option>
					<option value="ml">Malayalam</option>
					<option value="bn">Bengali</option>
					<option value="mr">Marathi</option>
					<option value="gu">Gujarati</option>
					<option value="pa">Punjabi</option>
					<option value="or">Odia</option>
					<option value="as">Assamese</option>
					<option value="ur">Urdu</option>
				</select>
			</label>
			<button type="submit">Dub Now</button>
		</form>

		<div id="result" class="hidden">
			<h2>Preview</h2>
			<div class="videos">
				<div>
					<h3>Original</h3>
					<video id="origVideo" controls></video>
				</div>
				<div>
					<h3>Dubbed</h3>
					<video id="dubVideo" controls></video>
				</div>
			</div>
			<a id="downloadLink" href="#" download>Download Dubbed Video</a>
		</div>
	</div>
	<script src="/static/app.js"></script>
</body>
</html>
